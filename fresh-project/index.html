<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Kitchen - Recipe Shuffle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #071321;
        --bg-mid: #0f2c3c;
        --accent-hot: #ff6b35;
        --accent-cool: #21d4b6;
        --card: #ffffffeb;
        --text-dark: #13222f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", sans-serif;
        color: var(--text-dark);
        background:
          radial-gradient(circle at 14% 18%, #1f5f78 0%, transparent 32%),
          radial-gradient(circle at 87% 80%, #15435d 0%, transparent 33%),
          linear-gradient(145deg, var(--bg-deep), var(--bg-mid));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app {
        width: min(920px, 100%);
        border-radius: 24px;
        background: linear-gradient(180deg, #ffffff, #eef7f7);
        box-shadow: 0 28px 70px #00000054;
        overflow: hidden;
        transform: translateY(12px);
        opacity: 0;
        animation: rise 700ms ease-out forwards;
      }

      @keyframes rise {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .hero {
        padding: 28px 28px 12px;
        background: linear-gradient(110deg, #ffe7d6, #dbfff6);
        border-bottom: 1px solid #0f2c3c1a;
      }

      .kicker {
        letter-spacing: 0.08em;
        font-size: 0.77rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #0f2c3c;
      }

      h1 {
        margin: 8px 0 0;
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.02em;
        font-size: clamp(2.1rem, 5.8vw, 3.2rem);
        line-height: 1;
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
        padding: 20px;
      }

      .panel {
        background: var(--card);
        border: 1px solid #1631431c;
        border-radius: 18px;
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        border: 0;
        border-radius: 999px;
        padding: 8px 12px;
        background: #ecf4f7;
        color: #123;
        font-weight: 600;
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease;
      }

      .chip:hover {
        transform: translateY(-1px);
      }

      .chip.active {
        background: #0f2c3c;
        color: #fff;
      }

      .recipe-card {
        border-radius: 16px;
        background: #fff;
        border: 1px solid #0f2c3c17;
        padding: 16px;
      }

      .recipe-name {
        margin: 0;
        font-size: 1.3rem;
      }

      .meta {
        margin: 8px 0 14px;
        color: #2e4450;
        font-size: 0.93rem;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      li {
        margin: 6px 0;
      }

      .actions {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        padding: 11px 14px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-main {
        color: #fff;
        background: linear-gradient(100deg, var(--accent-hot), #e85621);
      }

      .btn-alt {
        color: #07302d;
        background: linear-gradient(100deg, var(--accent-cool), #59f0d3);
      }

      .note {
        font-size: 0.9rem;
        color: #2f4956;
        margin-top: 12px;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div class="kicker">One-file mini project</div>
        <h1>Neon Kitchen Recipe Shuffle</h1>
      </section>

      <section class="content">
        <article class="panel">
          <h2>Pick your vibe</h2>
          <p>Choose a mood and generate a recipe idea with ingredients and a quick method.</p>
          <div id="moodChips" class="chips"></div>
          <div class="actions">
            <button id="shuffleBtn" class="btn btn-main">Shuffle Recipe</button>
            <button id="surpriseBtn" class="btn btn-alt">Surprise Me</button>
          </div>
          <p class="note">This project is self-contained in one HTML file: no build step needed.</p>
        </article>

        <article class="panel recipe-card">
          <h2 class="recipe-name" id="recipeName">Pick a mood to start</h2>
          <p class="meta" id="recipeMeta">Prep time and difficulty appear here.</p>
          <ul id="recipeList"></ul>
        </article>
      </section>
    </main>

    <script>
      const recipes = {
        cozy: [
          {
            name: "Smoky Tomato Butter Pasta",
            prep: "22 min",
            level: "Easy",
            items: ["Spaghetti", "Tomato paste", "Butter", "Chili flakes", "Parmesan"]
          },
          {
            name: "Golden Garlic Soup",
            prep: "28 min",
            level: "Easy",
            items: ["Potatoes", "Garlic", "Onion", "Stock", "Cream"]
          }
        ],
        bright: [
          {
            name: "Citrus Herb Rice Bowl",
            prep: "20 min",
            level: "Easy",
            items: ["Rice", "Lemon", "Cucumber", "Parsley", "Chickpeas"]
          },
          {
            name: "Mango Crunch Tacos",
            prep: "25 min",
            level: "Medium",
            items: ["Tortillas", "Mango", "Cabbage", "Beans", "Lime"]
          }
        ],
        spicy: [
          {
            name: "Firecracker Noodle Pan",
            prep: "18 min",
            level: "Medium",
            items: ["Noodles", "Soy sauce", "Sriracha", "Peppers", "Sesame"]
          },
          {
            name: "Red Curry Coconut Skillet",
            prep: "30 min",
            level: "Medium",
            items: ["Coconut milk", "Curry paste", "Carrots", "Tofu", "Basil"]
          }
        ],
        chill: [
          {
            name: "No-Cook Garden Wrap",
            prep: "12 min",
            level: "Easy",
            items: ["Wraps", "Hummus", "Tomato", "Spinach", "Feta"]
          },
          {
            name: "Yogurt Berry Toast Stack",
            prep: "10 min",
            level: "Easy",
            items: ["Bread", "Greek yogurt", "Berries", "Honey", "Mint"]
          }
        ]
      };

      const moods = Object.keys(recipes);
      const moodChips = document.getElementById("moodChips");
      const recipeName = document.getElementById("recipeName");
      const recipeMeta = document.getElementById("recipeMeta");
      const recipeList = document.getElementById("recipeList");
      const shuffleBtn = document.getElementById("shuffleBtn");
      const surpriseBtn = document.getElementById("surpriseBtn");

      let activeMood = null;

      function renderChips() {
        moodChips.innerHTML = "";

        moods.forEach((mood) => {
          const button = document.createElement("button");
          button.className = "chip" + (mood === activeMood ? " active" : "");
          button.textContent = mood.charAt(0).toUpperCase() + mood.slice(1);
          button.addEventListener("click", () => {
            activeMood = mood;
            renderChips();
            shuffleRecipe();
          });
          moodChips.appendChild(button);
        });
      }

      function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function shuffleRecipe() {
        if (!activeMood) {
          recipeName.textContent = "Pick a mood to start";
          recipeMeta.textContent = "Prep time and difficulty appear here.";
          recipeList.innerHTML = "";
          return;
        }

        const pick = randomItem(recipes[activeMood]);
        recipeName.textContent = pick.name;
        recipeMeta.textContent = "Mood: " + activeMood + " • " + pick.prep + " • " + pick.level;
        recipeList.innerHTML = "";

        pick.items.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          recipeList.appendChild(li);
        });
      }

      shuffleBtn.addEventListener("click", shuffleRecipe);
      surpriseBtn.addEventListener("click", () => {
        activeMood = randomItem(moods);
        renderChips();
        shuffleRecipe();
      });

      renderChips();
    </script>
  </body>
</html>
